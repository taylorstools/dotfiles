source = $HOME/.config/matugen/colors.conf
$scripts = $HOME/scripts

general {
    ignore_empty_input = true
}

background {
    monitor =
    path = $HOME/.config/.EffectsWallpaper.png
}

# Date
label {
    monitor =
    text = cmd[update:1000] echo ""$(date +'%A, %B %-d')""
    color = $light
    font_size = 42
    font_family = Inter Display ExtraLight
    position = 0, -23%
    halign = center
    valign = top
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%-I:%M")"
    color = $lighter
    font_size = 180
    font_family = Inter Display ExtraLight
    position = 0, -26%
    halign = center
    valign = top
}

# Username
label {
    monitor =
    text = cmd[] echo "   $(whoami | sed 's/^./\U&/')" # Capitalize first letter
    color = $lighter
    font_size = 48
    font_family = Inter Display ExtraLight
    position = 0, 32%
    halign = center
    valign = bottom
}

# Input field
input-field {
    monitor =
    size = 18%, 5%
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.5
    dots_center = true
    outer_color = $light $lighter 90deg
    check_color = rgb(800020) rgb(D22B2B) 90deg
    inner_color = rgba(0, 0, 0, 0.5)
    fail_color = $light $lighter 90deg
    fail_text = Try again
    capslock_color = -1
    font_color = $lighter
    fade_on_empty = false
    font_family = Inter Light
    placeholder_text =     Password
    hide_input = false
    position = 0, 25%
    halign = center
    valign = bottom
}

# Battery
label {
    monitor =
    text = cmd[update:1000] echo -e "$($scripts/hyprlock_battery.sh)"
    color = $light
    font_size = 32
    font_family = Inter Display ExtraLight
    position = 47, 34
    halign = left
    valign = bottom
}

# Sleep
label {
    monitor =
    text = 
    color = $light
    font_size = 52
    font_family = JetBrainsMono Nerd Font Mono
    position = -290, 17
    halign = right
    valign = bottom
    onclick = pidof hyprlock || (hyprlock -q & sleep 1) && systemctl suspend
}

# Shutdown
label {
    monitor =
    text = 󰐥
    color = $light
    font_size = 48
    font_family = JetBrainsMono Nerd Font Mono
    position = -210, 20
    halign = right
    valign = bottom
    onclick = systemctl poweroff
}

# Reboot
label {
    monitor =
    text = 
    color = $light
    font_size = 48
    font_family = JetBrainsMono Nerd Font Mono
    position = -130, 20
    halign = right
    valign = bottom
    onclick = systemctl reboot
}

# Windows
label {
    monitor =
    text = 󰖳
    color = $light
    font_size = 48
    font_family = JetBrainsMono Nerd Font Mono
    position = -50, 20
    halign = right
    valign = bottom
    onclick = sudo $scripts/boottowindows.sh
}