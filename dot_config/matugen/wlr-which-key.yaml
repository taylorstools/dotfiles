font: JetBrains Mono Nerd Font 12
background: "#000000CC"
color: "#ffffff"
border: "{{colors.primary.default.hex}}CC"
separator: " ➜ "
border_width: 1
corner_r: 10
padding: 25
anchor: center
inhibit_compositor_keyboard_shortcuts: false
auto_kbd_layout: true

menu:
  - key: "r"
    desc: Run
    cmd: exec kitty --title Runner $HOME/scripts/runner.sh
  - key: "t"
    desc: Terminal (Root)
    cmd: ghostty -e sudo -i
  - key: "e"
    desc: File Explorer (Root)
    cmd: sudo -EH thunar
  - key: "m"
    desc: Task Manager
    cmd: missioncenter
  - key: "k"
    desc: Disk Management
    cmd: sudo -EH gparted
  - key: "s"
    desc: Snipping Tool
    cmd: $HOME/scripts/snipping-tool.sh
  - key: "o"
    desc: OCR Select and Copy
    cmd: $HOME/scripts/ocr-snip.sh
  - key: "b"
    desc: Toggle Night Mode
    cmd: qs ipc call night toggle
  - key: "n"
    desc: Night Mode Strength
    cmd: $HOME/scripts/night-light-temperature.sh
  - key: "a"
    desc: Toggle Keep Awake
    cmd: $HOME/scripts/hypridle/toggle-hypridle.sh
  - key: "w"
    desc: Change Wallpaper
    cmd: qs ipc call wallpaper random
  - key: "d"
    desc: Change Refresh Rate
    cmd: $HOME/scripts/niri_change-refresh-rate.sh
  - key: "y"
    desc: Toggle Voice-to-Text
    cmd: whisrs toggle
  - key: "p"
    desc: Power
    cmd: qs ipc call powermenu toggle